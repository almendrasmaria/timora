spring:
  application:
    name: timora-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/timora}
    username: ${SPRING_DATASOURCE_USERNAME:timora}
    password: ${SPRING_DATASOURCE_PASSWORD:timora_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

timora:
  jwt:
    secret: ${JWT_SECRET:change-me-in-development}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    from: ${MAIL_FROM:no-reply@timora.app}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
