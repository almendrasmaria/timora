services:
  postgres:
    image: postgres:16-alpine
    container_name: timora-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timora}
      POSTGRES_USER: ${POSTGRES_USER:-timora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timora_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timora} -d ${POSTGRES_DB:-timora}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
