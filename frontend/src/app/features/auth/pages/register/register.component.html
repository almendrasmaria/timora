<app-auth-layout
  eyebrow="Gratis para empezar"
  headline="Convertí tu agenda en un sistema automático de turnos."
  [features]="features"
  headerActionLabel="Iniciar sesión"
  headerActionLink="/auth/login"
>
  <div class="auth-form-card">
    <h2 class="auth-form-card__title">Creá tu cuenta</h2>
    <p class="auth-form-card__subtitle">Empezá a recibir reservas en minutos</p>

    <form class="auth-form-card__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (apiError) {
        <p class="auth-form-card__api-error" role="alert">{{ apiError }}</p>
      }

      <app-text-field
        label="Email"
        type="email"
        placeholder="tu@email.com"
        autocomplete="email"
        formControlName="email"
        variant="outlined"
      />

      <app-text-field
        label="Contraseña"
        type="password"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
        formControlName="password"
        variant="outlined"
      />

      <app-text-field
        label="Confirmar contraseña"
        type="password"
        placeholder="Repetí tu contraseña"
        autocomplete="new-password"
        formControlName="confirmPassword"
        variant="outlined"
      />

      <app-button type="submit" variant="primary" [fullWidth]="true" [disabled]="loading || form.invalid">
        {{ loading ? 'Creando cuenta...' : 'Continuar' }}
      </app-button>
    </form>

    <div class="auth-form-card__divider">O también</div>

    <button type="button" class="auth-form-card__google-btn" (click)="onGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.79 2.72v2.26h2.9c1.7-1.57 2.69-3.87 2.69-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Registrarme con Google
    </button>

    <p class="auth-form-card__legal">
      Al registrarte aceptás los Términos y Condiciones
    </p>

    <div class="auth-form-card__footer">
      <p>¿Ya tenés una cuenta?</p>
      <a routerLink="/auth/login" class="auth-form-card__link">Iniciar sesión</a>
    </div>
  </div>
</app-auth-layout>
