<app-auth-layout
  headline="Convertí tu agenda en un sistema automático de turnos."
  [features]="features"
  headerActionLabel="Iniciar sesión"
  headerActionLink="/auth/login"
>
  <div class="auth-form-card">
    <h2 class="auth-form-card__title">Elegí una nueva contraseña</h2>

    <form class="auth-form-card__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (apiError) {
        <p class="auth-form-card__api-error" role="alert">{{ apiError }}</p>
      }

      <app-text-field
        label="Nueva contraseña"
        type="password"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
        formControlName="password"
        [error]="passwordError"
      />

      <app-text-field
        label="Confirmar contraseña"
        type="password"
        placeholder="Repetí tu contraseña"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [error]="confirmPasswordError"
      />

      <app-button type="submit" variant="primary" [fullWidth]="true" [disabled]="loading || !token">
        {{ loading ? 'Guardando...' : 'Guardar contraseña' }}
      </app-button>
    </form>

    <div class="auth-form-card__footer">
      <a routerLink="/auth/forgot-password" class="auth-form-card__link">Solicitar un nuevo enlace</a>
    </div>
  </div>
</app-auth-layout>
