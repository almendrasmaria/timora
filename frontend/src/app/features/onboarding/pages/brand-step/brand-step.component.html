<div class="onboarding-card">

  <div class="onboarding-card__progress">

    <div class="onboarding-card__progress-bar">

      @for (step of [1, 2, 3]; track step) {

        <span class="onboarding-card__progress-segment" [class.is-filled]="step <= currentStep"></span>

      }

    </div>

  </div>




  <h1 class="onboarding-card__title">Marca y link</h1>





  <form class="onboarding-card__form" [formGroup]="form" (ngSubmit)="onSubmit()">

    @if (apiError) {

      <p class="onboarding-card__api-error" role="alert">{{ apiError }}</p>

    }



    <div class="onboarding-card__field">

      <p class="onboarding-card__field-label">Logo del negocio (opcional)</p>

      <div class="onboarding-card__logo-upload">

        <div class="onboarding-card__logo-preview">

          @if (logoPreview) {

            <img [src]="logoPreview" alt="Vista previa del logo" />

          } @else {

            <span aria-hidden="true">+</span>

          }

        </div>

        <label class="onboarding-card__logo-button">

          {{ uploadingLogo ? 'Subiendo...' : 'Subir logo' }}

          <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" [disabled]="uploadingLogo" (change)="onLogoSelected($event)" />

        </label>

      </div>

    </div>



    <div class="onboarding-card__field">

      <p class="onboarding-card__field-label">Color de marca</p>

      <div class="onboarding-card__colors">

        @for (color of brandColors; track color.value) {

          <button

            type="button"

            class="onboarding-card__color"

            [class.is-selected]="form.controls.brandColor.value === color.value"

            (click)="selectColor(color.value)"

          >

            <span class="onboarding-card__color-swatch" [style.background]="color.value"></span>

            {{ color.label }}

          </button>

        }

      </div>

    </div>



    <app-text-field

      label="Link público"

      placeholder="tu-negocio"

      formControlName="slug"

      [error]="form.controls.slug.touched && form.controls.slug.invalid ? 'Usá solo letras minúsculas, números y guiones' : ''"

    />



    <div class="onboarding-card__footer">

      <a class="onboarding-card__back" [routerLink]="['/onboarding', 'contacto']">Atrás</a>

      <app-button type="submit" variant="primary" shape="pill" [fullWidth]="true" [disabled]="loading">

        {{ loading ? 'Finalizando...' : 'Finalizar' }}

      </app-button>

    </div>

  </form>

</div>
