<div class="onboarding-card">
  <div class="onboarding-card__progress">
    <div class="onboarding-card__progress-bar">
      @for (step of [1, 2, 3, 4, 5, 6, 7]; track step) {
        <span class="onboarding-card__progress-segment" [class.is-filled]="step <= currentStep"></span>
      }
    </div>
  </div>


  <h1 class="onboarding-card__title">Contacto</h1>
  <p class="onboarding-card__subtitle">Cómo te encuentran tus clientes</p>

  <form class="onboarding-card__form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (apiError) {
      <p class="onboarding-card__api-error" role="alert">{{ apiError }}</p>
    }

    <app-text-field
      label="WhatsApp"
      placeholder="Ej. 11 3545 6754"
      formControlName="whatsapp"
      [error]="form.controls.whatsapp.touched && form.controls.whatsapp.invalid ? 'El WhatsApp es obligatorio' : ''"
    />

    <app-text-field
      label="Instagram (opcional)"
      placeholder="Ej. tu.negocio"
      formControlName="instagram"
    />

    <div class="onboarding-card__footer">
      <a class="onboarding-card__back" [routerLink]="['/onboarding', 'negocio']">Atrás</a>
      <app-button type="submit" variant="primary" shape="pill" [fullWidth]="true" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Continuar' }}
      </app-button>
    </div>
  </form>
</div>
