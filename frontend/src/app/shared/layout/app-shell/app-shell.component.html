<div class="shell" [class.shell--menu-open]="mobileMenuOpen()">
  <header class="shell__header">
    <div class="shell__container">
      <div class="shell__bar">
      <a routerLink="/dashboard/inicio" class="shell__logo" (click)="closeMobileMenu()">
        <app-logo size="md" />
      </a>

      <nav class="shell__nav" aria-label="Navegación principal">
        @for (item of nav; track item.path) {
          <a
            class="shell__nav-link"
            [routerLink]="['/dashboard', item.path]"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === 'inicio' }"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="shell__actions">
        <div #userMenu class="shell__user-menu">
          <button
            type="button"
            class="shell__user-trigger"
            (click)="toggleUserMenu($event)"
            [attr.aria-expanded]="userMenuOpen()"
            aria-haspopup="menu"
            aria-controls="shell-user-dropdown"
          >
            <span class="shell__avatar" aria-hidden="true">{{ businessInitial }}</span>
            <span class="shell__user-name">{{ businessName || 'Mi negocio' }}</span>
            <svg class="shell__user-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          @if (userMenuOpen()) {
            <div id="shell-user-dropdown" class="shell__user-dropdown" role="menu" (click)="$event.stopPropagation()">
              @if (bookingSlug) {
                <p class="shell__user-dropdown-slug">{{ bookingSlug }}</p>
              }
              <button type="button" class="shell__user-dropdown-item" role="menuitem" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          }
        </div>

        <button
          type="button"
          class="shell__menu-toggle"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-controls="dashboard-mobile-menu"
          [attr.aria-label]="mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        >
          <span class="shell__menu-toggle-bar"></span>
          <span class="shell__menu-toggle-bar"></span>
          <span class="shell__menu-toggle-bar"></span>
        </button>
      </div>
      </div>

    </div>
  </header>

  @if (mobileMenuOpen()) {
    <div id="dashboard-mobile-menu" class="shell__mobile-menu">
      <div class="shell__mobile-menu-header">
        <button type="button" class="shell__mobile-close" (click)="closeMobileMenu()" aria-label="Cerrar menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <nav class="shell__mobile-nav" aria-label="Menú móvil">
        @for (item of nav; track item.path) {
          <a
            class="shell__mobile-nav-link"
            [routerLink]="['/dashboard', item.path]"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === 'inicio' }"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="shell__mobile-footer">
        @if (bookingSlug) {
          <p class="shell__mobile-slug">{{ bookingSlug }}</p>
        }
        <button type="button" class="shell__mobile-logout" (click)="logout()">Cerrar sesión</button>
      </div>
    </div>
  }

  @if (mobileMenuOpen()) {
    <button
      type="button"
      class="shell__backdrop"
      (click)="closeMobileMenu()"
      aria-label="Cerrar menú"
    ></button>
  }

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
