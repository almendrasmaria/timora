<div class="auth-layout">
  <header class="auth-layout__header">
    <div class="auth-layout__header-inner">
      <a routerLink="/" class="auth-layout__logo">
        <app-logo size="lg" />
      </a>
    </div>
  </header>

  <div class="auth-layout__body">
    <div class="auth-layout__glow" aria-hidden="true"></div>

    <section class="auth-layout__hero">
      <div class="auth-layout__hero-content">
        @if (eyebrow) {
          <span class="auth-layout__eyebrow">{{ eyebrow }}</span>
        }
        <h1 class="auth-layout__headline">{{ headline }}</h1>

        @if (features.length) {
          <ul class="auth-layout__features">
            @for (feature of features; track feature) {
              <li>
                <app-feature-item [text]="feature" />
              </li>
            }
          </ul>
        }
      </div>

      <div class="auth-layout__status">
        <span class="auth-layout__status-dot" aria-hidden="true"></span>
        Disponible
      </div>
    </section>

    <section class="auth-layout__form">
      <ng-content />
    </section>
  </div>
</div>
