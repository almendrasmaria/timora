<div class="field" [class.field--error]="!!error" [class.field--outlined]="variant === 'outlined'">
  @if (variant === 'outlined') {
    <div class="field__outlined-wrap">
      <input
        class="field__input"
        [type]="type"
        [value]="value"
        placeholder=" "
        [autocomplete]="autocomplete"
        [disabled]="disabled"
        (input)="onInput($event)"
        (blur)="onBlur()"
      />

      @if (label) {
        <label class="field__outlined-label">{{ label }}</label>
      }

      @if (hasLabelAction) {
        <span class="field__outlined-action">
          <ng-content select="[label-action]" />
        </span>
      }
    </div>
  } @else {
    @if (label) {
      <div class="field__label-row">
        <label class="field__label">{{ label }}</label>
        @if (required) {
          <span class="field__required">Requerido</span>
        }
        <ng-content select="[label-action]" />
      </div>
    }

    <input
      class="field__input"
      [type]="type"
      [value]="value"
      [placeholder]="placeholder"
      [autocomplete]="autocomplete"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
  }

  @if (error) {
    <span class="field__error">{{ error }}</span>
  } @else if (hint) {
    <span class="field__hint">{{ hint }}</span>
  }
</div>
